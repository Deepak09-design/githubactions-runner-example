
name: Terraform CI Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform on Amazon Linux EC2

    runs-on: [self-hosted, linux, x64, amazonlinux, dev]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test EC2 Runner
        shell: bash
        run: |
          echo "Runner is working"
          whoami
          pwd
          hostname
          which sudo

      - name: Check Terraform
        shell: bash
        run: terraform --version

      - name: Check AWS CLI
        shell: bash
        run: aws --version

      - name: Verify AWS Identity
        shell: bash
        run: aws sts get-caller-identity
