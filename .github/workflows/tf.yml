name: Terraform CI Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform on Amazon Linux EC2

    runs-on: [self-hosted, linux, x64, amazonlinux, dev]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test EC2 Runner
        run: |
          echo "Runner is working"
          whoami
          pwd
          hostname
          command -v sudo
          sudo whoami

      - name: Check Terraform
        run: |
          terraform --version

      - name: Check AWS CLI
        run: |
          aws --version

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity
